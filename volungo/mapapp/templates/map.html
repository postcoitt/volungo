<head>
    <title>Volungo Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
    body {
        background-color: #e6f2e6; /* світло-зелений фон */
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0;
    }

    /* Назва сайту */
    #our-name {
        position: absolute;
        top: 30px;
        left: 40px;
        font-style: italic;
        font-size: 150px;
        font-family: "Copperplate", fantasy;
        text-decoration: underline;
        color: #1b4d1b; /* темно-зелений */
    }

    #geolocation-popup {
        display: block;
        position: fixed;
        height: 200 px;
        width: 400px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #f5f5f5;
        border: 2px solid #4caf50;
        padding: 20px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        z-index: 1000;
        text-align: center;
    }
    #geolocation-popup .buttons {
    margin-top: 15px;
    }

    #geolocation-popup button {
    padding: 10px 20px;
    margin: 0 10px; /* відстань між кнопками */
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background-color: #4caf50;
    color: white;
    transition: background-color 0.2s;
    }

    #geolocation-popup button:hover {
    background-color: #45a049;
    }

    /* Кнопка профілю */
    #profile-button {
        position: absolute;
        right: 20px;
        top: 20px;
        height: 100px;
        width: 100px;
        border-radius: 50%;
        color: #fff;
        font-size: 18px;
        background-color: #4caf50; /* яскраво-зелений */
        border: 3px solid #388e3c;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    #profile-button:hover {
        background-color: #66bb6a;
        border-color: #2e7d32;
    }

    .actions-wrapper {
    position: absolute;
    right: 12.5px;
    top: 190px;
    }

    /* Основні дії */
    button.action-btn {
        height: 40px;
        width: 170px;
        font-size: 15px;
        color: #fff;
        background-color: #66bb6a;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    button.action-btn:hover {
        background-color: #81c784;
    }

    #actions {
    display: flex;
    gap: 12px;
    }

    #create-button { }
    #donation-button { }
    #filters-button { right: 12.5px; top: 190px; background-color: #81c784; color: #000; }
    #filters-button:hover { background-color: #a5d6a7; }

    #search-button {
        position: absolute;
        right: 12.5px;
        top: 245px;
        font-size: 16px;
        height: 40px;
        width: 190px;
        color: #000;
        background-color: #c8e6c9;
        border-radius: 8px;
        border: 1px solid #81c784;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    #search-button:hover {
        background-color: #a5d6a7;
    }

    /* Контейнер для фільтрів */
    .filters-container {
    position: relative;
    display: inline-block;
    }

    #filters {
    position: absolute;
    top: 45px;   /* під кнопкою */
    right: 0;
    width: 120px;
    background: #e8f5e9;
    padding: 10px;
    border: 1px solid #81c784;
    border-radius: 10px;
    display: none;
    z-index: 1000;
    }

    #filters button {
        display: block;
        width: 100%;
        margin-bottom: 5px;
        height: 35px;
        font-size: 14px;
        background-color: #66bb6a;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    #filters button:hover {
        background-color: #81c784;
    }

    /* Карта */
    #map {
        height: 700px;
        width: 100%;
        margin-top: 320px; /* відступ від верху для кнопок та заголовку */
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .user-marker .dot {
    width: 19px;
    height: 19px;
    background: #2A93EE;
    border: 3px solid white;
    border-radius: 50%;
    box-shadow:
    0 0 6px rgba(42,147,238,0.5),
    0 0 12px rgba(42,147,238,0.3)
    }


    /* контейнер всього popup */
    .locations-popup .popup-content {
        position: relative;  /* для абсолютного позиціонування елементів */
        width: 200px;
        height: 130px;
    }

    /* фон для всього popup */
    .locations-popup .leaflet-popup-content-wrapper {
        background-color: #66bb6a;  /* зелений фон */
        border-radius: 15px;
        padding: 0;
        width: auto;
        height: auto;
    }

    /* заголовок у верхньому лівому куті */
    .locations-popup .popup-title-wrapper {
        position: absolute;
        top: -10px;
        left: 0px;
        font-weight: bold;
        font-size: 20px;
    }

    /* текст під заголовком */
    .locations-popup .popup-text-wrapper {
        position: absolute;
        top: 30px;          /* під заголовком */
        left: 0px;
        right: 0px;         /* текст не прилипає до правого краю */
        font-size: 14px;
        color: white;
    }

    /* кнопка по центру внизу */
    .locations-popup .popup-button-wrapper {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
    }

    /* стиль кнопки */
    .locations-popup .popup-btn {
        background-color: white;
        color: #66bb6a;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s ease;
    }

    .locations-popup .popup-btn:hover {
        background-color: #55aa5a;
        color: white;
    }


    </style>
</head>

<body>

<h1 id="our-name">Volungo</h1>

<button id="profile-button">Ваш профіль</button>


<div id="geolocation-popup">
    <p>Надати свої координати?</p>
    <div class="geolocation-wrapper"></div>
        <button id="yes-button">Так</button>
        <button id="no-button">Ні</button>
    </div>
</div>


<div class="actions-wrapper">
    <div id="actions">
        <button id="create-button" class="action-btn">+ Створити подію</button>
        <button id="donation-button" class="action-btn">$ Зробити донат</button>

        <div class="filters-container">
            <button id="filters-button" class="action-btn">> Фільтрувати</button>

            <div id="filters">
                <button id="filter1">Фільтр 1</button>
                <button id="filter2">Фільтр 2</button>
                <button id="filter3">Фільтр 3</button>
            </div>
        </div>

    </div>
</div>

<button id="search-button">Знайти найближчі</button>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([49.84, 24.03], 13);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
  }).addTo(map);

  const locations = [
    { lat: 49.87, lon: 24.055, popup: "Локація 1" },
    { lat: 49.82, lon: 24.04, popup: "Локація 2" },
    { lat: 49.827, lon: 23.9725, popup: "Локація 3" }
    ];

    // додаємо піни на карту
    locations.forEach(loc => {
    L.marker([loc.lat, loc.lon])
      .addTo(map)
      .bindPopup(
        `<div class="popup-content">
    <div class="popup-title-wrapper">
        <h3 class="popup-title">${loc.popup}</h3>
    </div>
    <div class="popup-text-wrapper">
        <p class="popup-text">Потрібна допомога</p>
    </div>
    <div class="popup-button-wrapper">
        <button class="popup-btn">Детальніше</button>
    </div>
</div>`,
        { className: "locations-popup" }
      );
    });

  // === GEO POPUP ===
  const popup = document.getElementById("geolocation-popup");
  const yesButton = document.getElementById("yes-button");
  const noButton = document.getElementById("no-button");

  yesButton.addEventListener("click", () => {
    popup.style.display = "none";

    navigator.geolocation.getCurrentPosition(
        function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            console.log("Координати:", lat, lon);

            const userAvatar = L.divIcon({
                className: "user-marker",
                html: "<div class='dot'></div>",
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

            const userMarker = L.marker([lat, lon], {icon: userAvatar}).addTo(map)
                .openPopup();

            map.setView([lat, lon], 15);
        },
        function(error) {
            console.error("Помилка геолокації:", error);
            alert("Не вдалося отримати геолокацію");
        }
    );
});
   noButton.addEventListener("click", () => {
    popup.style.display = "none";
    })

  // === FILTERS ===
  const button = document.getElementById('filters-button');
  const filters = document.getElementById('filters');
  const before_clicking = "> Фільтрувати";
  const after_clicking = "⌄ Фільтрувати";
  let clicked = false;

  button.addEventListener('click', function() {
      if (!clicked) {
          button.innerText = after_clicking;
          clicked = true;
          filters.style.display = 'block';
      } else {
          button.innerText = before_clicking;
          clicked = false;
          filters.style.display = 'none';
      }
  });
</script>
