<h1 id="our-name">Volungo<h1></h1>

<button id="profile-button">Ваш профіль</button>

<script>
document.getElementById('profile-button').addEventListener('click', function() {
    fetch('/my-button-action/')
        .then(response => response.json())
        .then(data => {
            alert(data.message);  // показуємо результат
        });
});
</script>


<button id="donation-button">$ Зробити донат</button>
<button id="create-button">+ Створити подію</button>
<button id="search-button">Знайти найближчі</button>


<div id="map"></div>


<div class="filters-wrapper"></div>
    <button id="filters-button">⌄ Фільтрувати</button>

    <div id="filters" style="display: none;">
        <button id="filter1">Фільтр 1</button>
        <button id="filter2">Фільтр 2</button>
        <button id="filter3">Фільтр 3</button>
    </div>
</div>

<script>

const button = document.getElementById('filters-button');
const filters = document.getElementById('filters')

const before_clicking = "⌄ Фільтрувати";
const after_clicking = "> Фільтрувати";


let clicked = false;


button.addEventListener('click', function() {
    // чергуємо текст
    if (!clicked) {
        button.innerText = after_clicking;
        clicked = true;
        filters.style.display = 'block'
    }
    else {
        button.innerText = before_clicking;
        clicked = false;
        filters.style.display = 'none'
    }
});
</script>


<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([49.84, 24.03], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
    .addTo(map);
</script>


</body>
