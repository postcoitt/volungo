{% load static %}
<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volungo — Карта</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>
  <style>
    /* Приховуємо стандартну панель інструкцій LRM */
    .leaflet-routing-container { display: none !important; }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background-color: #e6f2e6;
      font-family: "Arial", sans-serif;
      margin: 0;
      padding: 0;
      color: #1b4d1b;
    }

    #our-name {
      position: absolute;
      top: 30px;
      left: 40px;
      font-style: italic;
      font-size: 150px;
      font-family: "Copperplate", fantasy;
      text-decoration: underline;
      color: #1b4d1b;
      z-index: 1000;
      pointer-events: none;
    }

    #profile-button {
      position: absolute;
      right: 20px;
      top: 20px;
      height: 100px;
      width: 100px;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      background-color: #4caf50;
      border: 3px solid #388e3c;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 1000;
    }
    #profile-button:hover { background-color: #66bb6a; border-color: #2e7d32; }

    .actions-wrapper {
      position: absolute;
      right: 12.5px;
      top: 190px;
      z-index: 1000;
    }

    button.action-btn {
      height: 40px;
      width: 140px;
      font-size: 15px;
      color: #fff;
      background-color: #66bb6a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button.action-btn:hover { background-color: #81c784; }

    #actions { display: flex; gap: 12px; }

    #search-button {
      position: absolute;
      right: 12.5px;
      top: 245px;
      font-size: 16px;
      height: 40px;
      width: 190px;
      color: #000;
      background-color: #c8e6c9;
      border-radius: 8px;
      border: 1px solid #81c784;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 500;
    }
    #search-button:hover { background-color: #a5d6a7; }

    .filters-container { position: relative; display: inline-block; }

    #filters {
      position: absolute;
      top: 45px;
      right: 0;
      width: 120px;
      background: #e8f5e9;
      padding: 10px;
      border: 1px solid #81c784;
      border-radius: 10px;
      display: none;
      z-index: 1000;
    }
    #filters button {
      display: block;
      width: 100%;
      margin-bottom: 5px;
      height: 35px;
      font-size: 14px;
      background-color: #66bb6a;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #filters button:hover { background-color: #81c784; }

    #map {
      height: 700px;
      width: 100%;
      margin-top: 320px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #geolocation-popup {
      display: none;
      position: fixed;
      width: 420px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #f5f5f5;
      border: 2px solid #4caf50;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 3000;
      text-align: center;
    }
    #geolocation-popup .buttons { margin-top: 15px; }
    #geolocation-popup button {
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #4caf50;
      color: white;
      transition: background-color 0.2s;
    }
    #geolocation-popup button:hover { background-color: #45a049; }

    .user-marker .dot {
      width: 19px;
      height: 19px;
      background: #2A93EE;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(42,147,238,0.5), 0 0 12px rgba(42,147,238,0.3);
    }

    /* ══ EVENT MODAL ══ */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(3px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      animation: fadeOverlay 0.2s ease;
    }
    #modal-overlay.active { display: flex; }

    @keyframes fadeOverlay {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    #event-modal {
      background: #fff;
      border-radius: 16px;
      width: 680px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      animation: slideUp 0.25s ease;
      position: relative;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      transition: background 0.2s;
      z-index: 10;
    }
    #modal-close:hover { background: #e0e0e0; }

    /* header: аватар | інфо | права панель відстані */
    .modal-header {
      display: flex;
      align-items: flex-start;
      gap: 1.2rem;
      padding: 1.6rem 1.6rem 1rem;
      border-bottom: 1px solid #eee;
    }

    .modal-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #d8ecd8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 2rem;
      color: #2d6a4f;
    }

    .modal-header-info { flex: 1; min-width: 0; }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1b4d1b;
      margin: 0 2rem 0.5rem 0;
      line-height: 1.25;
    }

    .modal-organiser {
      font-size: 0.82rem;
      color: #666;
      margin-bottom: 0.5rem;
    }
    .modal-organiser a {
      color: #2d6a4f;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .modal-organiser a:hover { border-bottom-color: #2d6a4f; }

    .modal-rating-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #bbb;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .modal-rating-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .stars {
      display: flex;
      gap: 1px;
      line-height: 1;
    }

    .star-wrap {
      position: relative;
      display: inline-block;
      font-size: 1.1rem;
      color: #ddd;
    }
    .star-wrap .star-fill {
      position: absolute;
      top: 0; left: 0;
      overflow: hidden;
      color: #f5a623;
      white-space: nowrap;
    }

    .rating-num {
      font-size: 0.82rem;
      color: #888;
      font-weight: 600;
    }

    /* ══ ПРАВА ПАНЕЛЬ — відстань + кнопка маршруту ══ */
    .modal-route-panel {
      display: none;            /* показується лише коли є геолокація */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-shrink: 0;
      min-width: 118px;
      background: #f0f9f0;
      border: 1px solid #a5d6a7;
      border-radius: 12px;
      padding: 0.8rem 1rem;
      text-align: center;
    }

    .modal-route-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #888;
      font-weight: 600;
    }

    /* Велике число відстані */
    .modal-route-distance {
      font-size: 1.55rem;
      font-weight: 800;
      color: #1b4d1b;
      line-height: 1.1;
    }

    .modal-route-sublabel {
      font-size: 0.7rem;
      color: #999;
    }

    /* Кнопка "Маршрут" */
    .btn-show-route {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.8rem;
      background: #2d6a4f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
      margin-top: 0.2rem;
    }
    .btn-show-route:hover { background: #1a3d2b; transform: translateY(-1px); }
    .btn-show-route:disabled {
      background: #a5d6a7;
      cursor: default;
      transform: none;
    }

    .modal-categories {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding: 0.9rem 1.6rem;
      border-bottom: 1px solid #eee;
    }

    .cat-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      font-size: 0.78rem;
      color: #2d6a4f;
      font-weight: 500;
    }
    .cat-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4caf50;
      flex-shrink: 0;
    }

    .modal-meta {
      display: flex;
      gap: 1.5rem;
      padding: 0.75rem 1.6rem;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      color: #555;
    }

    .meta-icon { font-size: 1rem; }

    .modal-description { padding: 1rem 1.6rem 0.5rem; }

    .modal-description h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .modal-description p {
      font-size: 0.9rem;
      color: #444;
      line-height: 1.65;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.6rem 1.4rem;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .btn-contact {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.1rem;
      border: 1.5px solid #4caf50;
      border-radius: 8px;
      background: transparent;
      color: #2d6a4f;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-contact:hover { background: #e8f5e9; }

    .btn-detail {
      padding: 0.65rem 1.6rem;
      background: #2d6a4f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-detail:hover { background: #1a3d2b; transform: translateY(-1px); }

    @media (max-width: 900px) {
      #our-name { font-size: 72px; left: 16px; top: 8px; }
      #event-modal { width: 98vw; }
      .modal-route-distance { font-size: 1.2rem; }
    }
  </style>
</head>

<body>

  <h1 id="our-name">Volungo</h1>

  {% if request.user.is_authenticated %}
  <a href="{% url 'profile' request.user.username %}" id="profile-button" title="Ваш профіль">
    {{ request.user.username|first|upper }}
  </a>
  {% else %}
  <button id="profile-button" title="Ваш профіль">U</button>
  {% endif %}

  <div class="actions-wrapper">
    <div id="actions">
      <button id="create-button" class="action-btn"
        onclick="window.location.href='{% url 'create_event' %}'">+ Створити подію</button>
      <button id="donation-button" class="action-btn">$ Зробити донат</button>

      <div class="filters-container">
        <button id="filters-button" class="action-btn">> Фільтрувати</button>
        <div id="filters">
          <button id="filter1">Фільтр 1</button>
          <button id="filter2">Фільтр 2</button>
          <button id="filter3">Фільтр 3</button>
        </div>
      </div>
    </div>
  </div>

  <button id="search-button">Знайти найближчі</button>

  <div id="geolocation-popup" role="dialog" aria-modal="true">
    <p>Надати свої координати?</p>
    <div class="buttons">
      <button id="yes-button">Так</button>
      <button id="no-button">Ні</button>
    </div>
  </div>

  <!-- ══ Event modal ══ -->
  <div id="modal-overlay">
    <div id="event-modal" role="dialog" aria-modal="true">
      <button id="modal-close" aria-label="Закрити">✕</button>

      <div class="modal-header">
        <div class="modal-avatar">🌿</div>

        <div class="modal-header-info">
          <div class="modal-title" id="modal-title">—</div>

          <div class="modal-organiser">
            Організатор: <a href="#" id="modal-organiser-link">—</a>
          </div>

          <div class="modal-rating-label">Рейтинг організатора</div>
          <div class="modal-rating-row">
            <div class="stars" id="modal-stars"></div>
            <span class="rating-num" id="modal-rating-num"></span>
          </div>
        </div>

        <!-- ДОДАНО: права панель — відстань зверху, кнопка маршруту знизу -->
        <div class="modal-route-panel" id="modal-route-panel">
          <div class="modal-route-label">По дорозі</div>
          <div class="modal-route-distance" id="modal-route-distance">…</div>
          <div class="modal-route-sublabel">від вас</div>
          <button class="btn-show-route" id="btn-show-route" disabled>
            🗺️ Маршрут
          </button>
        </div>
      </div>

      <div class="modal-categories" id="modal-categories"></div>

      <div class="modal-meta">
        <div class="meta-item">
          <span class="meta-icon">🕐</span>
          <span id="modal-duration">—</span>
        </div>
        <div class="meta-item">
          <span class="meta-icon">👥</span>
          <span id="modal-volunteers">—</span>
        </div>
        <div class="meta-item">
          <span class="meta-icon">📅</span>
          <span id="modal-datetime">—</span>
        </div>
      </div>

      <div class="modal-description">
        <h4>Опис події</h4>
        <p id="modal-description">—</p>
      </div>

      <div class="modal-footer">
        <button class="btn-contact">💬 Зв'язатися</button>
        <a href="#" class="btn-detail" id="modal-detail-btn">Перейти на сторінку →</a>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <!-- organiser ratings from Django (organizer review type only) -->
  <script>
    const ORGANISER_RATINGS = {
      {% for event in events %}
        "{{ event.organiser.username|escapejs }}": {{ event.organiser_avg_rating|default:"null" }},
      {% endfor %}
    };
  </script>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
  <script>
    const CATEGORY_LABELS = {
      animals:   'Допомога тваринам',
      nets:      'Плетіння сіток',
      shelter:   'Допомога в пансіонаті',
      food:      'Теплі страви',
      cleanup:   'Прибирання',
      children:  'Робота з дітьми',
      elderly:   'Допомога літнім',
      medical:   'Медична допомога',
      transport: 'Транспорт',
      other:     'Інше',
    };

    let userCoords = null;
    let currentEvt = null;          // подія відкрита у модалці зараз
    let activeRoutingControl = null; // активний маршрут LRM на карті

    let events = [
      {% for event in events %}
      {
        id:             {{ event.id }},
        lat:            {{ event.latitude|default:"null" }},
        lng:            {{ event.longitude|default:"null" }},
        name:           "{{ event.name|escapejs }}",
        description:    "{{ event.description|escapejs }}",
        duration:       "{{ event.duration|default:'' }}",
        max_volunteers: "{{ event.max_volunteers|default:'' }}",
        datetime:       "{{ event.datetime|date:'d.m.Y H:i'|default:'' }}",
        organiser:      "{{ event.organiser.username|escapejs }}",
        categories:     {{ event.categories|safe|default:"[]" }},
      },
      {% endfor %}
    ];
    events = events.filter(e => e.lat !== null && e.lng !== null);

    // ── half-star renderer ──
    function renderStars(rating) {
      const container = document.getElementById('modal-stars');
      const numEl     = document.getElementById('modal-rating-num');
      container.innerHTML = '';

      if (rating === null || rating === undefined) {
        numEl.textContent = 'Немає оцінок';
        for (let i = 0; i < 5; i++) {
          const w = document.createElement('span');
          w.className = 'star-wrap';
          w.textContent = '★';
          container.appendChild(w);
        }
        return;
      }

      numEl.textContent = rating.toFixed(1);

      for (let i = 1; i <= 5; i++) {
        const w = document.createElement('span');
        w.className = 'star-wrap';
        w.textContent = '★';

        const fill = document.createElement('span');
        fill.className = 'star-fill';
        fill.textContent = '★';

        let pct = 0;
        if (rating >= i)       pct = 100;
        else if (rating > i-1) pct = Math.round((rating - (i - 1)) * 100);

        fill.style.width = pct + '%';
        w.appendChild(fill);
        container.appendChild(w);
      }
    }

    // ── Запит відстані через OSRM без малювання лінії (для показу в панелі) ──
    function fetchDistanceOnly(fromLat, fromLng, toLat, toLng, onResult) {
      const url = `https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=false`;
      fetch(url)
        .then(r => r.json())
        .then(data => {
          if (data.routes && data.routes.length > 0) {
            const meters = data.routes[0].distance;
            onResult(meters >= 1000
              ? (meters / 1000).toFixed(1) + ' км'
              : Math.round(meters) + ' м');
          } else {
            onResult(null);
          }
        })
        .catch(() => onResult(null));
    }

    // ── Будує маршрут через Leaflet Routing Machine + підганяє карту ──
    function buildRouteOnMap(fromLat, fromLng, toLat, toLng) {
      if (activeRoutingControl) {
        map.removeControl(activeRoutingControl);
        activeRoutingControl = null;
      }

      const control = L.Routing.control({
        waypoints: [
          L.latLng(fromLat, fromLng),
          L.latLng(toLat, toLng),
        ],
        router: L.Routing.osrmv1({
          serviceUrl: 'https://router.project-osrm.org/route/v1',
          language: 'uk',
        }),
        lineOptions: {
          styles: [{ color: '#2d6a4f', weight: 5, opacity: 0.85 }],
          extendToWaypoints: true,
          missingRouteTolerance: 0,
        },
        createMarker: () => null,  // не перемальовуємо маркери — вони вже є
        show: false,
        addWaypoints: false,
        fitSelectedRoutes: true,   // карта автоматично підганяє zoom щоб маршрут влазив
        showAlternatives: false,
      });

      control.addTo(map);
      activeRoutingControl = control;
    }

    // ── map init ──
    const map = L.map('map').setView([49.84, 24.03], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    const userAvatar = L.divIcon({
      className: "user-marker",
      html: "<div class='dot'></div>",
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    const overlay    = document.getElementById('modal-overlay');
    const modalClose = document.getElementById('modal-close');

    function openModal(evt) {
      currentEvt = evt;

      document.getElementById('modal-title').textContent = evt.name;

      const orgLink = document.getElementById('modal-organiser-link');
      orgLink.textContent = evt.organiser || '—';
      orgLink.href = evt.organiser ? `/profile/${evt.organiser}/` : '#';

      const rating = (ORGANISER_RATINGS[evt.organiser] !== undefined)
        ? ORGANISER_RATINGS[evt.organiser]
        : null;
      renderStars(rating);

      const catContainer = document.getElementById('modal-categories');
      catContainer.innerHTML = '';
      const cats = Array.isArray(evt.categories) ? evt.categories : [];
      if (cats.length === 0) {
        catContainer.innerHTML = '<span style="font-size:0.8rem;color:#aaa;">Категорії не вказані</span>';
      } else {
        cats.forEach(c => {
          const tag = document.createElement('span');
          tag.className = 'cat-tag';
          tag.innerHTML = `<span class="cat-dot"></span>${CATEGORY_LABELS[c] || c}`;
          catContainer.appendChild(tag);
        });
      }

      document.getElementById('modal-duration').textContent =
        evt.duration ? `${evt.duration} год.` : '—';
      document.getElementById('modal-volunteers').textContent =
        evt.max_volunteers ? `До ${evt.max_volunteers} волонтерів` : '—';
      document.getElementById('modal-datetime').textContent =
        evt.datetime || '—';
      document.getElementById('modal-description').textContent =
        evt.description || '—';
      document.getElementById('modal-detail-btn').href = `/map/event/${evt.id}/`;

      overlay.classList.add('active');
      map.setView([evt.lat + 0.006, evt.lng], 15);

      // Права панель: показуємо лише якщо є геолокація
      const panel    = document.getElementById('modal-route-panel');
      const distEl   = document.getElementById('modal-route-distance');
      const routeBtn = document.getElementById('btn-show-route');

      if (userCoords) {
        panel.style.display = 'flex';
        distEl.textContent  = '…';
        routeBtn.disabled   = true;

        // Тільки запитуємо відстань — маршрут НЕ малюємо автоматично
        fetchDistanceOnly(userCoords.lat, userCoords.lng, evt.lat, evt.lng, function(dist) {
          distEl.textContent = dist || '?';
          routeBtn.disabled  = !dist;
        });
      } else {
        panel.style.display = 'none';
      }
    }

    function closeModal() {
      overlay.classList.remove('active');
    }

    modalClose.addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // Кнопка "Маршрут": закриває модалку → будує маршрут через LRM → карта підганяє zoom
    document.getElementById('btn-show-route').addEventListener('click', function() {
      if (!userCoords || !currentEvt) return;
      closeModal();
      buildRouteOnMap(userCoords.lat, userCoords.lng, currentEvt.lat, currentEvt.lng);
    });

    events.forEach(evt => {
      const marker = L.marker([evt.lat, evt.lng]).addTo(map);
      marker.on('click', () => openModal(evt));
    });

    // При кліку на карту — прибираємо маршрут
    map.on('click', function() {
      if (activeRoutingControl) {
        map.removeControl(activeRoutingControl);
        activeRoutingControl = null;
      }
    });

    // ── geolocation ──
    const geoPopup = document.getElementById("geolocation-popup");
    window.addEventListener('load', () => {
      if ("geolocation" in navigator) geoPopup.style.display = "block";
    });

    document.getElementById("yes-button").addEventListener("click", () => {
      geoPopup.style.display = "none";
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude: lat, longitude: lng } = pos.coords;
          L.marker([lat, lng], { icon: userAvatar }).addTo(map);
          map.setView([lat, lng], 15);
          userCoords = { lat, lng };
        },
        () => alert("Не вдалося отримати геолокацію")
      );
    });

    document.getElementById("no-button").addEventListener("click", () => {
      geoPopup.style.display = "none";
    });

    // ── filters toggle ──
    const filtersBtn = document.getElementById('filters-button');
    const filtersDiv = document.getElementById('filters');
    let filtersOpen  = false;
    filtersBtn.addEventListener('click', function() {
      filtersOpen = !filtersOpen;
      filtersBtn.innerText = filtersOpen ? "⌄ Фільтрувати" : "> Фільтрувати";
      filtersDiv.style.display = filtersOpen ? 'block' : 'none';
    });
  </script>
</body>
</html>
