<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Volungo – Вхід</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest:   #1a3d2b;
      --moss:     #2d6a4f;
      --leaf:     #52b788;
      --mint:     #b7e4c7;
      --cream:    #f4f1eb;
      --bark:     #3d2b1f;
      --gold:     #c9a84c;
    }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      overflow: hidden;
    }

    .panel-left {
      position: relative;
      background: var(--forest);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 3rem;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
    }
    .blob-1 { width: 420px; height: 420px; background: var(--moss);  top: -100px; left: -80px; }
    .blob-2 { width: 280px; height: 280px; background: var(--leaf);  top: 40%;   left: 30%;  opacity: 0.2; }
    .blob-3 { width: 340px; height: 340px; background: var(--forest); bottom: -80px; right: -60px; opacity: 0.6; }

    .leaf-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(82,183,136,0.12) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .deco-ring {
      position: absolute;
      width: 380px; height: 380px;
      border: 1.5px solid rgba(82,183,136,0.25);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -55%);
    }
    .deco-ring-2 {
      position: absolute;
      width: 260px; height: 260px;
      border: 1px solid rgba(82,183,136,0.15);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -55%);
    }

    .panel-left-content { position: relative; z-index: 2; }

    .wordmark {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 2.6rem;
      color: var(--cream);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .wordmark span { color: var(--leaf); }

    .tagline {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 1rem;
      color: var(--mint);
      opacity: 0.8;
      margin-bottom: 2rem;
    }

    .stat-row { display: flex; gap: 2rem; }
    .stat-num {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.6rem;
      color: var(--leaf);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.72rem;
      color: var(--mint);
      opacity: 0.65;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .panel-right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      background: var(--cream);
      position: relative;
    }

    .panel-right::before,
    .panel-right::after {
      content: '';
      position: absolute;
      width: 120px; height: 120px;
      border-color: var(--mint);
      border-style: solid;
      opacity: 0.5;
    }
    .panel-right::before { top: 2rem; right: 2rem; border-width: 1px 1px 0 0; }
    .panel-right::after  { bottom: 2rem; left: 2rem; border-width: 0 0 1px 1px; }

    .form-card {
      width: 100%;
      max-width: 380px;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .form-header { margin-bottom: 2.4rem; }

    .form-eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--leaf);
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .form-title {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 2rem;
      color: var(--forest);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .form-group { margin-bottom: 1.2rem; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--bark);
      margin-bottom: 0.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1.5px solid #d4ccbe;
      border-radius: 8px;
      background: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--forest);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--leaf);
      box-shadow: 0 0 0 3px rgba(82,183,136,0.15);
    }

    .errorlist {
      list-style: none;
      margin-top: 0.35rem;
    }
    .errorlist li {
      font-size: 0.78rem;
      color: #c0392b;
    }

    .btn-login {
      width: 100%;
      padding: 0.9rem;
      background: var(--moss);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.03em;
      position: relative;
      overflow: hidden;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-login:hover  { background: var(--forest); transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }

    .btn-login::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .signup-row {
      text-align: center;
      margin-top: 1.4rem;
      font-size: 0.85rem;
      color: #7a7468;
    }
    .signup-row a {
      color: var(--moss);
      font-weight: 500;
      text-decoration: none;
    }
    .signup-row a:hover { text-decoration: underline; }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 1.4rem 0;
      color: #bbb8b0;
      font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #ddd9d0;
    }

    @media (max-width: 700px) {
      body { grid-template-columns: 1fr; }
      .panel-left { display: none; }
    }
  </style>
</head>
<body>

  <div class="panel-left">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="leaf-grid"></div>
    <div class="deco-ring"></div>
    <div class="deco-ring-2"></div>

    <div class="panel-left-content">
      <div class="wordmark">Volun<span>go</span></div>
      <div class="tagline">Волонтерство, де б ти не був.</div>
      <div class="stat-row">
        <div class="stat">
          <div class="stat-num">4.2k</div>
          <div class="stat-label">Волонтерів</div>
        </div>
        <div class="stat">
          <div class="stat-num">830</div>
          <div class="stat-label">Подій</div>
        </div>
        <div class="stat">
          <div class="stat-num">61</div>
          <div class="stat-label">Міст</div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel-right">
    <div class="form-card">
      <div class="form-header">
        <div class="form-eyebrow">З поверненням</div>
        <div class="form-title">Увійти до<br>акаунту</div>
      </div>

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_identifier">Ім'я користувача або Email</label>
          <input type="text" name="identifier" id="id_identifier" placeholder="Ім'я користувача або Email" required>
        </div>

        <div class="form-group">
          <label for="id_password">Пароль</label>
          <input type="password" name="password" id="id_password" placeholder="Пароль" required>
        </div>

        {% if messages %}
          {% for message in messages %}
            <div class="errorlist">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <button type="submit" class="btn-login">Увійти</button>
      </form>

      <div class="divider">або</div>

      <div class="signup-row">
        Немає акаунту? <a href="{% url 'register' %}">Приєднатись</a>
      </div>
    </div>
  </div>

</body>
</html>
