{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Volungo – Профіль учасника</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest:  #1a3d2b;
      --moss:    #2d6a4f;
      --leaf:    #52b788;
      --mint:    #b7e4c7;
      --cream:   #f4f1eb;
      --bark:    #3d2b1f;
      --muted:   #7a7468;
      --border:  #d4ccbe;
      --warning: #f1c40f;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--forest);
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--forest);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem; height: 64px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
    .topbar-title {
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 1.2rem; color: #fff;
    }
    .btn-back {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.85rem; color: var(--mint); text-decoration: none;
      padding: 0.4rem 0.8rem; border: 1px solid rgba(183,228,199,0.3);
      border-radius: 6px; transition: background 0.2s;
    }
    .btn-back:hover { background: rgba(255,255,255,0.08); }

    /* ── Layout ── */
    .page-wrap {
      max-width: 1000px; margin: 0 auto;
      padding: 3rem 2rem;
    }
    .profile-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 3rem;
      align-items: start;
    }

    /* ── Sidebar (Left Column) ── */
    .profile-sidebar {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .avatar-large {
      width: 120px; height: 120px;
      background: var(--forest); border: 4px solid var(--warning);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 2.5rem; font-weight: 500;
      margin: 0 auto 1rem;
    }
    .badge-pill {
      display: inline-block;
      background: var(--warning); color: var(--bark);
      font-size: 0.8rem; font-weight: 600; padding: 0.3rem 1rem;
      border-radius: 999px; margin-bottom: 1.5rem;
    }
    .stats-row {
      display: flex; justify-content: center; gap: 1.5rem;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 1rem 0; margin-bottom: 1rem;
    }
    .stat-item { display: flex; flex-direction: column; }
    .stat-value { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 600; color: var(--moss); }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .no-badges { font-size: 0.8rem; color: var(--muted); margin-top: 1rem; }

    /* ── Main Content (Right Column) ── */
    .profile-main {
      display: flex; flex-direction: column; gap: 2.5rem;
    }
    .header-info h2 { font-size: 1rem; color: var(--muted); font-weight: 500; margin-bottom: 0.2rem; }
    .header-info h1 { font-family: 'Fraunces', serif; font-size: 2.5rem; color: var(--forest); }

    /* Buttons */
    .action-buttons {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem;
    }
    .btn {
      padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 500;
      text-align: center; cursor: pointer; text-decoration: none; transition: all 0.2s;
    }
    .btn-solid { background: var(--moss); color: #fff; border: 1.5px solid var(--moss); }
    .btn-solid:hover { background: var(--forest); border-color: var(--forest); }
    .btn-outline { background: transparent; color: var(--moss); border: 1.5px solid var(--moss); }
    .btn-outline:hover { background: var(--mint); color: var(--forest); }
    .btn-dashed { background: transparent; color: var(--muted); border: 1.5px dashed var(--muted); }
    .btn-dashed:hover { border-color: var(--moss); color: var(--moss); }

    /* Sections (Reviews, Achievements) */
    .content-section {
      border-top: 1.5px solid var(--border); padding-top: 1.5rem;
    }
    .section-title {
      font-size: 1.2rem; font-weight: 600; color: var(--forest);
      font-style: italic; margin-bottom: 1rem; display: block;
    }
    .empty-state {
      font-size: 0.9rem; color: var(--muted); background: rgba(255,255,255,0.5);
      padding: 1rem; border-radius: 8px; border: 1px solid var(--border);
    }

    /* ── Mobile Adaptation ── */
    @media (max-width: 768px) {
      .topbar { padding: 0 1rem; height: 56px; }
      .btn-back span { display: none; } /* Ховаємо текст кнопки назад, лишаємо стрілку */
      .btn-back { padding: 0.4rem; gap: 0; justify-content: center; border-radius: 50%; width: 32px; height: 32px; }

      .page-wrap { padding: 1.5rem 1rem; }
      .profile-grid {
        grid-template-columns: 1fr; /* Робимо одну колонку */
        gap: 1.5rem;
      }
      .action-buttons { grid-template-columns: 1fr; } /* Кнопки одна під одною на весь екран */
      .header-info h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <nav class="topbar">
    <div class="topbar-title">Профіль учасника</div>
    <a class="btn-back" href="{% url 'map' %}">
      ← <span>Повернутись до карти</span>
    </a>
  </nav>

  <div class="page-wrap">
    <div class="profile-grid">

      <div class="profile-sidebar">
        <div class="avatar-large">SO</div>
        <div class="badge-pill">Новачок</div>

        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-value">0</span>
            <span class="stat-label">Годин</span>
          </div>
          <div class="stat-item">
            <span class="stat-value">⭐ 0</span>
            <span class="stat-label">Рейтинг</span>
          </div>
        </div>

        <div class="no-badges">Немає бейджів</div>
      </div>

      <div class="profile-main">

        <div class="header-info">
          <h2>Користувач:</h2>
          <h1>Sophia</h1>
        </div>

        <div class="action-buttons">
          <button class="btn btn-solid">👤 Додати до друзів</button>
          <button class="btn btn-outline">✎ Додати відгук</button>
          <button class="btn btn-dashed">+ Додати години</button>
          <button class="btn btn-dashed">+ Додати бейдж</button>
        </div>

        <div class="content-section">
          <h3 class="section-title">Досягнення:</h3>
          <div class="empty-state">Поки немає досягнень.</div>
        </div>

        <div class="content-section">
          <h3 class="section-title">Відгуки як помічника:</h3>
          <div class="empty-state">Ще немає відгуків.</div>
        </div>

        <div class="content-section">
          <h3 class="section-title">Відгуки як організатора:</h3>
          <div class="empty-state">Ще немає відгуків.</div>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
